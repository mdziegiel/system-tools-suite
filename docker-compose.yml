services:
  system-tools-suite:
    build: .
    image: system-tools-suite:latest
    container_name: system-tools-suite
    restart: unless-stopped
    ports:
      - "10233:10233"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DIST_DIR: /app/dist
    volumes:
      - system_tools_suite_data:/data
volumes:
  system_tools_suite_data:
