services:
  system-tools-suite:
    build: .
    image: system-tools-suite:latest
    container_name: system-tools-suite
    restart: unless-stopped
    ports:
      - "10233:10233"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DIST_DIR: /app/dist
    volumes:
      - system-tools-suite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10233/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  system-tools-suite-data:
