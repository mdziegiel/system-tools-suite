services:
  system-tools-suite:
    build: .
    container_name: system-tools-suite
    restart: unless-stopped
    ports:
      - "10233:10233"
    environment:
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - DATA_DIR=/data
    volumes:
      - system-tools-suite-data:/data
volumes:
  system-tools-suite-data:
